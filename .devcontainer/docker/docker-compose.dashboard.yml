version: "3.9"

services:
  dashboard:
    image: ghcr.io/hallboard-team/node-angular:node${NODE_VERSION:-24}-ng${ANGULAR_VERSION:-21}
    container_name: ${COMPOSE_PROJECT_NAME:-template}-dashboard

    working_dir: /workspaces/app

    volumes:
      # mount repo
      - ../../:/workspaces/app:Z
      # shared VS Code server cache
      - ${HOME}/.cache/vscode-server-shared:/home/vscode/.vscode-server-shared:Z
      # Codex cache to keep login state
      - ${HOME}/.cache/codex:/home/vscode/.codex:Z

    environment:
      - VSCODE_SERVER_DIR=/home/vscode/.vscode-server-shared
      - CODEX_HOME=/home/vscode/.codex

    ports:
      # dashboard → http://localhost:4200
      - "${PORT_DASHBOARD:-4200}:4200"

    command: >
      bash -c "
        node -v &&
        ng version || true &&
        sleep infinity
      "
